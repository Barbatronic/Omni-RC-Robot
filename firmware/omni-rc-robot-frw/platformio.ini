; =============================================================================
;  Omni-RC-Robot - firmware ESP32-S3
;  Robot RC omnidirectionnel 4 roues - SBUS + BTS7960 + interface Web embarquee
; =============================================================================
;
;  Environnements :
;    [env:freenove_esp32_s3_wroom]  firmware embarque (compilation / upload)
;    [env:native_mixer_test]        tests unitaires du mixer sur PC (sans carte)
;
;  Commandes utiles :
;    pio run                        compile le firmware
;    pio run -t upload              televerse le firmware
;    pio run -t uploadfs            televerse l'interface Web (dossier data/)
;    pio device monitor             ouvre le terminal serie
;    pio test -e native_mixer_test  execute les tests du mixer sur PC
; =============================================================================

[platformio]
default_envs = freenove_esp32_s3_wroom

[env:freenove_esp32_s3_wroom]
platform  = espressif32@6.12.0
board     = freenove_esp32_s3_wroom
framework = arduino

; Le port USB "UART" de la carte Freenove expose UART0 (GPIO43/44) a 115200 bauds.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; L'interface Web (dossier data/) est stockee en LittleFS dans la partition SPIFFS.
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    esp32async/AsyncTCP@^3.4.0
    esp32async/ESPAsyncWebServer@^3.7.0

build_flags =
    -std=gnu++17
    -Wall
    ; Reduit le bruit des logs internes du core ESP-IDF sur le terminal serie.
    -DFIRMWARE_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
    ; La boucle de controle moteur tourne sur le coeur 1 : on force la pile
    ; reseau asynchrone sur le coeur 0 pour qu'une requete Web ne puisse jamais
    ; retarder le pilotage des moteurs.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192

build_unflags =
    -std=gnu++11

; -----------------------------------------------------------------------------
; Tests unitaires du mixer omnidirectionnel, executes directement sur le PC.
; omni_drive_mixer.cpp ne depend que de <cmath> : il est donc compilable hors ESP32.
; -----------------------------------------------------------------------------
[env:native_mixer_test]
platform       = native
test_framework = unity
build_flags    =
    -std=gnu++17
    -I include
; Compile le seul fichier du mixer, sans le reste du firmware ESP32.
test_build_src   = yes
build_src_filter = +<omni_drive_mixer.cpp>

; -----------------------------------------------------------------------------
; Variante pour le port USB NATIF de la carte (celui marque "USB", pas "UART").
;
; Sur ce port, l'ESP32-S3 expose un peripherique USB JTAG/CDC (303A:1001).
; La definition de carte route Serial vers UART0 (GPIO43/44) : sans cet
; environnement, le televersement fonctionne mais le terminal serie reste vide.
;
; Ici, Serial est redirige vers le CDC USB natif, ce qui rend les logs visibles
; sur le meme cable que celui utilise pour le televersement.
;
;   pio run -e freenove_esp32_s3_wroom_usb -t upload
;   pio device monitor -e freenove_esp32_s3_wroom_usb
; -----------------------------------------------------------------------------
[env:freenove_esp32_s3_wroom_usb]
extends = env:freenove_esp32_s3_wroom

build_unflags =
    ${env:freenove_esp32_s3_wroom.build_unflags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

build_flags =
    ${env:freenove_esp32_s3_wroom.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; -----------------------------------------------------------------------------
; Outil de mise au point : identifie le protocole reellement emis par le
; recepteur RC (SBUS, iBUS, CRSF...) en essayant les vitesses et polarites
; courantes. A utiliser quand aucune trame n'est decodee malgre un cablage sain.
;
;   pio run -e radio_scan -t upload && pio device monitor -e radio_scan
;
; Ce n'est PAS le firmware du robot : il ne pilote aucun moteur.
; -----------------------------------------------------------------------------
[env:radio_scan]
extends     = env:freenove_esp32_s3_wroom_usb
build_flags =
    ${env:freenove_esp32_s3_wroom_usb.build_flags}
    -DRADIO_PROTOCOL_SCAN
